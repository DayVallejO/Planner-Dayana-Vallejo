<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="container-xl header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M8.5 15l2.2 2.2L15.5 13"/></svg>
        </div>
        <div>
          <h1 class="brand-title">Planificador</h1>
          <p class="brand-subtitle">Organiza, asigna y termina tus tareas</p>
        </div>
      </div>

      <div class="stats" aria-live="polite">
        <div class="stat">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statActive">0</div>
          <div class="stat-label">En curso</div>
        </div>
        <div class="stat stat-wide">
          <div class="stat-value" id="statPercent">0%</div>
          <div class="stat-label">Completado</div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-xl layout">
    <div class="row g-4 align-items-start">

      <!-- Formulario para crear tareas -->
      <div class="col-12 col-lg-5 col-xl-4">
        <section class="panel form-panel" aria-labelledby="formTitle">
          <h2 class="panel-title" id="formTitle">Nueva tarea</h2>
          <p class="panel-hint">Completa todos los campos para agregarla al tablero.</p>

          <div class="alert alert-danger form-alert" id="formErrors" role="alert" hidden></div>

          <form id="taskForm" novalidate>
            <div class="field">
              <label class="form-label" for="taskName">Nombre</label>
              <input class="form-control input" type="text" id="taskName" name="taskName" placeholder="Ej. Diseñar la página de inicio" required>
              <small class="invalid-feedback field-error" id="taskNameError"></small>
            </div>

            <div class="field">
              <label class="form-label" for="taskDescription">Descripción</label>
              <textarea class="form-control input" id="taskDescription" name="taskDescription" rows="3" placeholder="¿Qué hay que hacer exactamente?" required></textarea>
              <small class="invalid-feedback field-error" id="taskDescriptionError"></small>
            </div>

            <div class="field">
              <label class="form-label" for="taskAssignee">Asignado a</label>
              <input class="form-control input" type="text" id="taskAssignee" name="taskAssignee" placeholder="Nombre y apellido" required>
              <small class="invalid-feedback field-error" id="taskAssigneeError"></small>
            </div>

            <div class="row g-3">
              <div class="col-sm-6 field">
                <label class="form-label" for="taskDueDate">Fecha de entrega</label>
                <input class="form-control input" type="date" id="taskDueDate" name="taskDueDate" required>
                <small class="invalid-feedback field-error" id="taskDueDateError"></small>
              </div>

              <div class="col-sm-6 field">
                <label class="form-label" for="taskStatus">Estado</label>
                <select class="form-select input" id="taskStatus" name="taskStatus" required>
                  <option value="">Selecciona…</option>
                  <option value="PENDIENTE">Pendiente</option>
                  <option value="EN PROGRESO">En progreso</option>
                  <option value="REVISIÓN">Revisión</option>
                  <option value="HECHO">Hecho</option>
                </select>
                <small class="invalid-feedback field-error" id="taskStatusError"></small>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Agregar tarea
            </button>
          </form>
        </section>
      </div>

      <!-- Lista de tareas -->
      <div class="col-12 col-lg-7 col-xl-8">
        <section class="board" aria-labelledby="boardTitle">
          <div class="board-head">
            <h2 class="panel-title" id="boardTitle">Mis tareas</h2>
            <span class="board-count"><span id="visibleCount">0</span> visibles</span>
          </div>

          <div class="filters" id="filters">
            <button type="button" class="chip is-active" data-filter="TODAS" aria-pressed="true">Todas <span class="chip-count" data-count="TODAS">0</span></button>
            <button type="button" class="chip" data-filter="PENDIENTE" aria-pressed="false">Pendiente <span class="chip-count" data-count="PENDIENTE">0</span></button>
            <button type="button" class="chip" data-filter="EN PROGRESO" aria-pressed="false">En progreso <span class="chip-count" data-count="EN PROGRESO">0</span></button>
            <button type="button" class="chip" data-filter="REVISIÓN" aria-pressed="false">Revisión <span class="chip-count" data-count="REVISIÓN">0</span></button>
            <button type="button" class="chip" data-filter="HECHO" aria-pressed="false">Hecho <span class="chip-count" data-count="HECHO">0</span></button>
          </div>

          <div class="empty-state" id="emptyState">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
            <p class="empty-title">No hay tareas aquí</p>
            <p>Agrega una desde el formulario o cambia el filtro.</p>
          </div>

          <!-- Aquí se agregan las tarjetas de las tareas (una columna de Bootstrap por tarjeta) -->
          <div class="row row-cols-1 row-cols-md-2 row-cols-xxl-3 g-3" id="tasksContainer"></div>
        </section>
      </div>

    </div>
  </main>

  <footer class="app-footer">Despreocupate, en un solo lugar lo tienes todo</footer>

  <script src="js/taskManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
